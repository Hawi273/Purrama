<!doctype html>

<link rel="icon" href="../assets/logo/purrama-logo.svg">
<link rel="stylesheet" href="../css/purrama.css">

</header>

</div>
<form class="pr-card" style="width: 100%; box-sizing: border-box; padding: 40px 32px 32px; border-radius: var(--radius-xl); box-shadow: var(--shadow-hero); display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; flex-direction: column; gap: 6px; text-align: center;">
<h1 style="margin: 0; font: 600 32px/1.15 var(--font-display);">Welcome back</h1>
<p style="margin: 0; font: 400 15px/1.6 var(--font-body); color: var(--text-secondary);">Sign in to pick up where you left off.</p>
</div>
<div class="pt-field"><label for="email">Email</label><input autocomplete="email" id="email" placeholder="you@example.com" type="email"/></div>
<div class="pt-field"><label for="pw">Password</label><input autocomplete="current-password" id="pw" placeholder="Your password" type="password"/></div>
<a class="pt-link" href="#" style="align-self: flex-end; font-size: 14px; margin-top: -6px;">Forgot password?</a>
<button class="pr-btn pr-btn--primary" style="width: 100%;" type="submit">Sign in</button>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px;">
<span style="flex: 1 1 auto; height: 0; border-top: var(--border-hair) solid var(--hairline);"></span>
<span class="pt-meta">New to Purrama?</span>
<span style="flex: 1 1 auto; height: 0; border-top: var(--border-hair) solid var(--hairline);"></span>
</div>
<a class="pr-btn pr-btn--brand" href="onboarding.html" style="width: 100%; box-sizing: border-box;">Create an account</a>
</form>
<p class="pt-meta" style="margin: 28px 0 0; text-align: center;">By continuing you agree to our <a class="pt-link" href="#">Terms</a> and <a class="pt-link" href="#">Privacy policy</a>.</p>
</div>
</main>
</div>
<script src="../js/purrama.js"></script>
</body>
</html>
