    <g transform="translate(196 92) scale(0.8)"><path class="pm-star" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.2 6.6L12 17.4l-5.8 3.2 1.2-6.6L2.5 9.4l6.6-.8z"></path></g>
