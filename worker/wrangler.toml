name = "purrama-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Serve only at purrama-api.<subdomain>.workers.dev; no extra per-version
# preview URLs that could also be used to reach TMDB with the token.
workers_dev = true
preview_urls = false

# Production: only the GitHub Pages site may call this proxy.
# The TMDB token is NOT here: it is the Worker secret TMDB_TOKEN.
[vars]
ALLOWED_ORIGINS = "https://hawi273.github.io"

# 120 requests per minute per visitor IP (a details page makes a few calls).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 120
  period = 60

# Local development only (`npm run dev:api` = wrangler dev --env dev).
# Never deployed: Cloudflare builds run `wrangler deploy` without --env.
[env.dev]
workers_dev = false

  [env.dev.vars]
  ALLOWED_ORIGINS = "http://localhost:8000,http://127.0.0.1:8000"

  [[env.dev.ratelimits]]
  name = "RATE_LIMITER"
  namespace_id = "1001"

    [env.dev.ratelimits.simple]
    limit = 120
    period = 60
