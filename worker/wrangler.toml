name = "purrama-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Sites allowed to call this proxy. The TMDB token is NOT here: set it with
#   npx wrangler secret put TMDB_TOKEN
[vars]
ALLOWED_ORIGINS = "https://hawi273.github.io,http://localhost:8000"

# 60 requests per minute per visitor IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
