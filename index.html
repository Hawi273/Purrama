<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tighten connect-src to your Worker's exact URL once it is deployed. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://image.tmdb.org; connect-src https://*.workers.dev http://localhost:8787; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Purrama</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <h1 class="brand">Purrama</h1>
    <form id="search" class="search" role="search">
      <label for="q" class="visually-hidden">Search movies</label>
      <input id="q" type="search" placeholder="Search movies" autocomplete="off" maxlength="100" required>
      <button type="submit">Search</button>
    </form>
    <nav class="tabs" aria-label="Views">
      <button type="button" data-view="trending" aria-pressed="true">Trending</button>
      <button type="button" data-view="mine" aria-pressed="false">My ratings</button>
    </nav>
  </header>

  <main>
    <h2 id="heading">Trending this week</h2>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <ul id="grid" class="grid"></ul>
  </main>

  <footer class="foot">
    <p>
      Movie data and images from <a href="https://www.themoviedb.org/" rel="noopener">TMDB</a>.
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </p>
    <p>Your ratings are stored only in this browser.</p>
  </footer>
</body>
</html>
